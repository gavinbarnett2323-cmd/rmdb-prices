# Research data job (2026-11-19): SEC EDGAR filings and XBRL facts for the stock universe in
# relay/crisis_universe.txt, for the vault's company crisis detector (Investing/engine/crisis/).
# Runs when the list, the script or this file changes, or by hand. Never scheduled.
# Writes relay/research/fundamentals.json.gz and fundamentals_status.json.
name: research-fundamentals
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "only the first N tickers (0 = all)"
        default: "0"
  push:
    paths:
      - "relay/research_fundamentals.py"
      - "relay/crisis_universe.txt"
      - ".github/workflows/research_fundamentals.yml"
permissions:
  contents: write
concurrency:
  group: research-fundamentals
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch SEC filings and facts (no key, 10 requests a second)
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: python3 relay/research_fundamentals.py
      - name: Commit the data
        run: |
          git config user.name  "research-fundamentals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add relay/research/fundamentals.json.gz relay/research/fundamentals_status.json
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "research fundamentals $(date -u +%F\ %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash origin main && git push && break || sleep 5; done
